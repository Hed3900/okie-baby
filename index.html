<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FlashNews24</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #1c1c1c;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .card-content {
      padding: 10px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      color: #ffcc00;
    }

    .desc {
      font-size: 14px;
      margin-top: 5px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<header>
  FLASH NEWS 24 🔥
</header>
  
<div class="container" id="news">Loading...</div>
<div class="container">
  <iframe 
    src="https://flashnews24.site" 
    width="100%" 
    height="600px" 
    style="border:none;border-radius:10px;">
  </iframe>
</div>
<script>
function loadPosts(data) {
  let output = "";

  if (!data.feed.entry) {
    document.getElementById("news").innerHTML = "No posts found";
    return;
  }

  data.feed.entry.slice(0,5).forEach(post => {
    let title = post.title.$t;

    let link = "#";
    for (let i = 0; i < post.link.length; i++) {
      if (post.link[i].rel === "alternate") {
        link = post.link[i].href;
        break;
      }
    }

    let desc = post.summary ? post.summary.$t : "";

    output += `
    <div style="background:#1c1c1c;padding:10px;margin:10px;border-radius:10px;">
      <h3 style="color:#ffcc00;">🔥 ${title}</h3>
      <p>${desc.substring(0,80)}...</p>
      <a href="${link}" style="background:red;color:white;padding:6px 10px;text-decoration:none;border-radius:5px;">Read More</a>
    </div>
    `;
  });

  document.getElementById("news").innerHTML = output;
}
</script>

<script src="https://flashnews24.site/feeds/posts/default?alt=json-in-script&callback=loadPosts"></script>
<footer>
  © 2026 FlashNews24 | All Rights Reserved
</footer>

</body>
</html>
