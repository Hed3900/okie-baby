<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FlashNews24</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #1c1c1c;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .card-content {
      padding: 10px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      color: #ffcc00;
    }

    .desc {
      font-size: 14px;
      margin-top: 5px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  FLASH NEWS 24 🔥
</header>

<div class="container">

  <!-- NEWS CARD 1 -->
  <div class="card">
    <img src="https://via.placeholder.com/600x300">
    <div class="card-content">
      <div class="title">🚨 Breaking News Title</div>
      <div class="desc">Short description of the news. Click below to read more.</div>
      <a href="#" class="btn">Read More</a>
    </div>
  </div>

  <!-- NEWS CARD 2 -->
  <div class="card">
    <img src="https://via.placeholder.com/600x300">
    <div class="card-content">
      <div class="title">📱 Tech Update</div>
      <div class="desc">Latest mobile or tech news update goes here.</div>
      <a href="#" class="btn">Read More</a>
    </div>
  </div>

  <!-- NEWS CARD 3 -->
  <div class="card">
    <img src="https://via.placeholder.com/600x300">
    <div class="card-content">
      <div class="title">🚆 Job Alert</div>
      <div class="desc">Latest job notification details here.</div>
      <a href="#" class="btn">Read More</a>
    </div>
  </div>

</div>

<footer>
  © 2026 FlashNews24 | All Rights Reserved
</footer>

</body>
</html>
