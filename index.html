<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>FlashNews24</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: #e50914;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #1c1c1c;
      margin-bottom: 15px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .card-content {
      padding: 10px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      color: #ffcc00;
    }

    .desc {
      font-size: 14px;
      margin-top: 5px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background: #e50914;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }

    .telegram {
      display: block;
      background: #0088cc;
      color: white;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      margin-top: 15px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 10px;
      background: #111;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  FLASH NEWS 24 🔥
</header>

<!-- Breaking News -->

</div>

<div class="container">

  <div class="card">

      <div class="title">🔥 Latest Breaking News</div>
      <div class="desc">Check latest updates from FlashNews24</div>
      <a href="https://flashnews24.site" class="btn">Visit Site</a>
    </div>
  </div>

  <!-- Card 2 -->
  <div class="card">
    <img src="https://source.unsplash.com/600x300/?accident">
    <div class="card-content">
      <div class="title">🚨 Yamuna Boat Accident</div>
      <div class="desc">8 dead after boat capsized in Mathura</div>
      <a href="https://flashnews24.site/2026/04/" class="btn">Read More</a>

  <!-- Telegram Button -->
  <a href="https://t.me/flashnews24news" class="telegram">
    📢 Join Telegram for Fast Updates

</div>

<footer>
  © 2026 FlashNews24 | All Rights Reserved

</html>
